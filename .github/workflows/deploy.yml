name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/portfolio-website-build-hQ97A]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but let an in-progress run finish rather
# than cancelling it — cancelling a mid-flight Pages deploy surfaces as a
# spurious red "failure" job. Matches GitHub's official Pages workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Derive base path
        id: base
        run: |
          # A custom domain (public/CNAME present) serves from the root,
          # so the basePath must be empty. Likewise for a user/org
          # *.github.io repo. Otherwise the project lives under
          # /<repo-name>/ on github.io and needs that prefix.
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -f public/CNAME ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          elif [ "${REPO_NAME}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base }}
          NEXT_PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
