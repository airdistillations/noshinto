<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IR</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#bebebe" />
<meta name="description" content="Private." />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preload" href="fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- The viewer. Present from the start but veiled; the passcode opens onto it. -->
  <main class="stage" id="stage" aria-hidden="true">
    <canvas id="canvas"></canvas>
  </main>

  <!-- The gate: a passcode keypad on a device-shaped panel.
       Laid out in the design's own 393x852 coordinate space and scaled to fit
       the viewport, so the proportions survive at any size. -->
  <section class="gate" id="gate">
    <div class="phone" id="phone">
      <!-- Everything that shakes on a wrong code lives inside this element. -->
      <div class="phone__body" id="body">

        <p class="prompt" id="prompt">Do you
have
the code
?</p>

        <div class="slots" id="slots" role="status" aria-live="polite" aria-label="Passcode entry"></div>

        <div class="tick" id="tick" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path transform="translate(3.85,5.975)" d="M 5.7 12.025 L 0 6.325 L 1.425 4.9 L 5.7 9.175 L 14.875 0 L 16.3 1.425 L 5.7 12.025 Z" fill="currentColor" fill-rule="evenodd"></path>
          </svg>
        </div>

        <div class="pad" id="pad">
          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key--zero" type="button" data-digit="0">0</button>
          <button class="key key--del" type="button" id="del" aria-label="Delete">del</button>
        </div>

        <div class="open" id="open">
          <button class="open__btn" type="button" id="enter">enter</button>
        </div>
      </div>
    </div>

    <!-- Outside the panel, and outside the element that shakes: with the device
         frame gone there is nothing to clip this to, so it washes the whole
         screen rather than a 393x852 rectangle of it. -->
    <div class="glow" id="glow" aria-hidden="true"></div>
  </section>

  <!-- Bottom player, revealed with the monogram. -->
  <div class="player" id="player" aria-hidden="true">
    <button class="player__btn" type="button" id="playBtn" aria-label="Pause">
      <svg class="player__icon player__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="5" width="3.4" height="14" rx="1.1" fill="currentColor" />
        <rect x="13.6" y="5" width="3.4" height="14" rx="1.1" fill="currentColor" />
      </svg>
      <svg class="player__icon player__icon--play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.5 5.4a1 1 0 0 1 1.52-.85l8.1 5.6a1 1 0 0 1 0 1.7l-8.1 5.6a1 1 0 0 1-1.52-.85V5.4Z" fill="currentColor" />
      </svg>
    </button>

    <div class="player__ticker">
      <!-- Two identical halves; the track slides exactly -50% and loops, so the
           seam never lands anywhere visible. -->
      <div class="player__track">
        <span class="player__half">
          <span class="player__title">I Love You Always Forever</span>
          <span class="player__dot">·</span>
          <span class="player__artist">Donna Lewis</span>
        </span>
        <span class="player__half" aria-hidden="true">
          <span class="player__title">I Love You Always Forever</span>
          <span class="player__dot">·</span>
          <span class="player__artist">Donna Lewis</span>
        </span>
      </div>
    </div>
  </div>

  <audio id="audio" src="audio/donna-lewis-i-love-you-always-forever.mp3" preload="auto" loop></audio>

  <noscript>
    <div class="noscript">This page needs JavaScript.</div>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
