<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IR</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f2eee6" />
<meta name="description" content="Private." />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preload" href="fonts/italiana-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/cormorant-garamond-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- The viewer. Present from the start but veiled; the gate lifts to reveal it. -->
  <main class="stage" id="stage" aria-hidden="true">
    <canvas id="canvas"></canvas>
  </main>

  <!-- The gate. -->
  <section class="gate" id="gate">
    <div class="gate__inner">
      <p class="gate__eyebrow">Private</p>

      <h1 class="gate__mark" aria-label="I R">
        <span>I</span><span class="gate__amp">&amp;</span><span>R</span>
      </h1>

      <form class="gate__form" id="form" novalidate>
        <div class="field" id="field">
          <input
            id="password"
            class="field__input"
            type="password"
            inputmode="text"
            autocomplete="current-password"
            aria-label="Password"
            aria-describedby="message"
            spellcheck="false"
            autocapitalize="off"
            autofocus
          />
          <span class="field__rule" aria-hidden="true"></span>
          <span class="field__placeholder" id="placeholder" aria-hidden="true">password</span>
        </div>

        <button class="enter" id="submit" type="submit">
          <span class="enter__label">Enter</span>
        </button>
      </form>

      <p class="gate__message" id="message" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- Paper grain. pointer-events:none, or it swallows every tap. -->
  <div class="grain" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">This page needs JavaScript.</div>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
